<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <a href="/" class="login-brand">
                    <div class="brand-icon">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <span class="brand-name">CloudSpend</span>
                </a>
                <h2>Welcome back</h2>
                <p>Sign in to manage cloud expenses and budgets</p>
            </div>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="emailInput">Email Address</label>
                    <div class="input-icon-wrap">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="emailInput" class="form-input with-icon" value="admin@example.com" placeholder="admin@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <label class="form-label" for="passwordInput">Password</label>
                    </div>
                    <div class="input-icon-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="passwordInput" class="form-input with-icon" value="password123" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="demo-creds-box">
                    <div class="demo-creds-title">
                        <i class="fa-solid fa-key"></i> Default Demo Credentials:
                    </div>
                    <div class="demo-creds-item">Email: <code>admin@example.com</code></div>
                    <div class="demo-creds-item">Password: <code>password123</code></div>
                </div>

                <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:1.25rem;">
                    Sign in to Dashboard <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <a href="/">&larr; Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-box"></div>

    <script src="/static/js/app.js"></script>
    <script>
        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showToast('Please enter both email and password', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Invalid email or password');
                }

                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = data.redirect || '/dashboard';
                }, 500);
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Sign in to Dashboard <i class="fa-solid fa-arrow-right"></i>';
            }
        }
    </script>
</body>
</html>
