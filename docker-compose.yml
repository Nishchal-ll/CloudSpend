services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cloudspend-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=debug
    volumes:
      - ./:/app
      - go-modules:/go/pkg/mod
    restart: unless-stopped

volumes:
  go-modules:
